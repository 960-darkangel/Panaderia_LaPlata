
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar producto - Panadería</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>Panadería La Plata</h1>
        <p>Sistema de Gestión</p>
    </header>

    <main>
        <h2>Registrar producto</h2>
        <p>Complete los datos del nuevo producto.</p>

        <form class="formulario">

            <label for="tipo">Tipo de producto:</label>
            <select id="tipo" name="tipo">
                <option value="">Seleccione una opción</option>
                <option>Pan</option>
                <option>Factura</option>
            </select>

            <label for="codigo">Código:</label>
            <input type="number" id="codigo" placeholder="Ingrese el código">

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Nombre del producto">

            <label for="precio">Precio:</label>
            <input type="number" id="precio" placeholder="Ingrese el precio">

            <label for="stock">Stock inicial:</label>
            <input type="number" id="stock" placeholder="Cantidad disponible">

            <label for="unidad">Unidad de venta:</label>
            <select id="unidad" name="unidad">
                <option>kg</option>
                <option>unidad</option>
                <option>docena</option>
                <option>paquete</option>
            </select>

            <label for="detalle">Tipo de harina o factura:</label>
            <input type="text" id="detalle"
                   placeholder="Ej.: Integral o Dulce">

            <div class="acciones">
                <button type="button">Guardar producto</button>
                <a href="index.html" class="boton-secundario">
                    Volver al menú
                </a>
            </div>

        </form>
    </main>

    <footer>
        <p>Sistema de Gestión provisional de Panadería La Plata</p>
    </footer>

</body>
</html>
