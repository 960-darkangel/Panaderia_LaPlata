
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar stock - Panadería</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Panadería La Plata</h1>
        <p>Sistema de Gestión</p>
    </header>

    <main>
        <h2>Actualizar stock</h2>
        <p>Modifique la cantidad disponible de un producto.</p>

        <form class="formulario">
            <label for="codigo">Código del producto:</label>
            <input type="number" id="codigo" placeholder="Ingrese el código">

            <label for="stock-actual">Stock actual:</label>
            <input type="number" id="stock-actual" value="15" disabled>

            <label for="nuevo-stock">Nueva cantidad:</label>
            <input type="number" id="nuevo-stock" min="0"
                   placeholder="Ingrese la nueva cantidad">

            <div class="acciones">
                <button type="button">Actualizar stock</button>
                <a href="index.html" class="boton-secundario">
                    Volver al menú
                </a>
            </div>
        </form>
    </main>

    <footer>
        <p>Sistema de Gestión provisional de Panadería La Plata</p>
    </footer>
</body>
</html>
